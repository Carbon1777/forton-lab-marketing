name: max_resend

# Досылка в MAX постов из published/, которые в MAX не ушли (нет max_post_id,
# дата не раньше MAX_START_DATE). Другие каналы не трогает. Только вручную.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: max-resend
  cancel-in-progress: false

jobs:
  resend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Post to MAX
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_CHANNEL_ID: ${{ secrets.MAX_CHANNEL_ID }}
          MAX_START_DATE: ${{ vars.MAX_START_DATE }}
        run: python src/max_post.py
      - name: Commit
        if: ${{ !cancelled() }}
        run: |
          if [ -z "$(git status --porcelain published/)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add published/
          git commit -m "auto: max_resend [skip ci]"
          git pull --rebase origin main
          git push
