name: funnel_metrics

# TG-доставка ОТКЛЮЧЕНА (quick 260530-x7x, 2026-05-31): гибридный отчёт
# (src/hybrid_report, store_metrics.yml, Пн) шлёт per-app сообщение в канал
# «Планировщик» и покрывает воронку Diktum. Этот workflow оставлен ЖИВЫМ ради
# накопления собственного снапшота funnel_snapshots.json (изоляция, без правок
# кода diktum_funnel), но БЕЗ дублирующего сообщения в канал: TG-creds в шаге
# обнулены → send_to_planner вернёт False (WARN), сообщение не уйдёт; шаг помечен
# continue-on-error чтобы rc=1 от пропущенной отправки не валил job.
#
# Еженедельный отчёт-воронка Diktum (install → registration → activation).
# Cron Вт 12:07 UTC = 15:07 МСК. +7 мин offset против GH-cron-drift
# (тот же приём, что store_metrics). Период отчёта = прошлая неделя Пн–Вс.
#
# Primary trigger: Cloudflare Worker `forton-cron-trigger` (Вт 12:07 UTC
# POST'ит на /actions/workflows/funnel_metrics.yml/dispatches). CF cron
# секундной точности, не throttles. GH schedule оставлен как backup —
# если CF Worker умрёт, GH-cron сработает (обычно).
# Incident 2026-05-26: оба новых workflow (funnel + centry_funnel) дропнулись
# на первом плановом вторнике — добавлен CF Worker как primary.
# CF Worker source: marketing-v3/cf-worker/forton-cron-trigger/
on:
  schedule:
    - cron: "7 12 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write   # commit snapshot JSON

concurrency:
  group: diktum-funnel
  cancel-in-progress: false

jobs:
  collect-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.BOT_DISPATCH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect funnel snapshot (TG-send disabled — см. шапку)
        # TG-доставка отключена: гибридный отчёт (hybrid_report) шлёт per-app в
        # понедельник. Пустые TG-creds → send_to_planner вернёт False (WARN), но
        # снапшот/лог отрабатывают. continue-on-error: rc=1 не валит job.
        continue-on-error: true
        env:
          TG_PLANNER_BOT_TOKEN: ""
          TG_OWNER_CHAT_ID: ""
          APPMETRICA_OAUTH_TOKEN: ${{ secrets.APPMETRICA_OAUTH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: PYTHONPATH=. python -m src.diktum_funnel.cli

      - name: Commit updated snapshot
        env:
          GIT_AUTHOR_NAME: forton-metrics-bot
          GIT_AUTHOR_EMAIL: forton-metrics-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: forton-metrics-bot
          GIT_COMMITTER_EMAIL: forton-metrics-bot@users.noreply.github.com
        run: |
          # git add сначала: на первом запуске файл untracked, и `git diff
          # --quiet` его НЕ видит (вернул бы 0 → коммит пропускался). Стейджим,
          # затем проверяем staged-дифф — работает для нового/изменённого/равного.
          git add .metrics/funnel_snapshots.json
          if git diff --cached --quiet -- .metrics/funnel_snapshots.json; then
            echo "snapshot unchanged — no commit"
            exit 0
          fi
          git commit -m "auto: weekly funnel snapshot [skip ci]"
          git pull --rebase
          git push
