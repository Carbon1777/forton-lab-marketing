name: monthly_report

# Ежемесячный per-app отчёт за предыдущий полный месяц с MoM-сравнением.
# Отправляет отдельное сообщение на каждый продукт в TG-канал «Планировщик».
# Источники: AppMetrica (installs/активность/воронка/экраны) + Supabase
# (регистрации→активация для Centry/Diktum).
#
# Cron: 5-е число каждого месяца 06:00 UTC = 09:00 МСК.
# Sub-hour offset не нужен (0 мин) — нет конкурентных ежемесячных запусков.
#
# Snapshot коммитится обратно в repo через BOT_DISPATCH_PAT.
on:
  schedule:
    - cron: "0 14 5 * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: monthly-report
  cancel-in-progress: false

jobs:
  collect-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.BOT_DISPATCH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect + render + send monthly per-app report
        env:
          # ------------ TG ------------
          TG_PLANNER_BOT_TOKEN: ${{ secrets.TG_PLANNER_BOT_TOKEN }}
          TG_OWNER_CHAT_ID: ${{ secrets.TG_OWNER_CHAT_ID }}

          # ------------ AppMetrica — installs/активность/воронка/экраны ----------
          APPMETRICA_OAUTH_TOKEN: ${{ secrets.APPMETRICA_OAUTH_TOKEN }}

          # ------------ Supabase — регистрации → активация (Centry + Diktum) ----
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL_CENTRY: ${{ secrets.SUPABASE_URL_CENTRY }}
          SUPABASE_SERVICE_ROLE_KEY_CENTRY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_CENTRY }}

          # ------------ Apple App Store — Analytics Reports installs + RSS -------
          # Стор-блок месячного отчёта (260611-8za). Секреты те же, что в
          # store_metrics.yml — новых не заводим.
          ASC_APP_ID_CENTRY: ${{ secrets.ASC_APP_ID_CENTRY }}
          ASC_APP_ID_DIKTUM: ${{ secrets.ASC_APP_ID_DIKTUM }}
          ASC_APP_ID_LUCEA: ${{ secrets.ASC_APP_ID_LUCEA }}
          ASC_APP_ID_LAPULYA: ${{ secrets.ASC_APP_ID_LAPULYA }}
          ASC_APP_ID_UNIA: ${{ secrets.ASC_APP_ID_UNIA }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}

          # ------------ Google Play — GCS monthly CSV + androidpublisher ---------
          GOOGLE_PLAY_SA_JSON: ${{ secrets.GOOGLE_PLAY_SA_JSON }}
          GPLAY_DEVELOPER_ID: ${{ secrets.GPLAY_DEVELOPER_ID }}
          GPLAY_PACKAGE_CENTRY: ${{ secrets.GPLAY_PACKAGE_CENTRY }}
          GPLAY_PACKAGE_DIKTUM: ${{ secrets.GPLAY_PACKAGE_DIKTUM }}
          GPLAY_PACKAGE_LUCEA: ${{ secrets.GPLAY_PACKAGE_LUCEA }}
          GPLAY_PACKAGE_LAPULYA: ${{ secrets.GPLAY_PACKAGE_LAPULYA }}
          GPLAY_PACKAGE_UNIA: ${{ secrets.GPLAY_PACKAGE_UNIA }}

          # ------------ RuStore — reviews via JWS API (installs N/A, Mail.ru) ----
          RUSTORE_PRIVATE_KEY: ${{ secrets.RUSTORE_PRIVATE_KEY }}
          RUSTORE_KEY_ID: ${{ secrets.RUSTORE_KEY_ID }}
          RUSTORE_COMPANY_ID: ${{ secrets.RUSTORE_COMPANY_ID }}
          RUSTORE_PACKAGE_CENTRY: ${{ secrets.RUSTORE_PACKAGE_CENTRY }}
          RUSTORE_PACKAGE_DIKTUM: ${{ secrets.RUSTORE_PACKAGE_DIKTUM }}
          RUSTORE_PACKAGE_LUCEA: ${{ secrets.RUSTORE_PACKAGE_LUCEA }}
          RUSTORE_PACKAGE_LAPULYA: ${{ secrets.RUSTORE_PACKAGE_LAPULYA }}
          RUSTORE_PACKAGE_UNIA: ${{ secrets.RUSTORE_PACKAGE_UNIA }}
        run: PYTHONPATH=. python -m src.monthly_report.cli

      - name: Commit updated monthly snapshots
        env:
          GIT_AUTHOR_NAME: forton-metrics-bot
          GIT_AUTHOR_EMAIL: forton-metrics-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: forton-metrics-bot
          GIT_COMMITTER_EMAIL: forton-metrics-bot@users.noreply.github.com
        run: |
          git add .metrics/monthly_snapshots.json
          if git diff --cached --quiet -- .metrics/monthly_snapshots.json; then
            echo "snapshot unchanged — no commit"
            exit 0
          fi
          git commit -m "auto: monthly report snapshot [skip ci]"
          git pull --rebase
          git push
