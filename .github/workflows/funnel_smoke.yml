name: funnel_smoke

# Этап 0 — ручная проверка доступа к AppMetrica + Supabase из GH-раннера
# (США, без VPN). Запускать через "Run workflow" в Actions. Gate: оба = 200.
on:
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: AppMetrica reachability
        env:
          TOKEN: ${{ secrets.APPMETRICA_OAUTH_TOKEN }}
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: OAuth $TOKEN" \
            "https://api.appmetrica.yandex.ru/management/v1/application/6301663")
          echo "AppMetrica HTTP=$CODE"
          test "$CODE" = "200"

      - name: Supabase reachability
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "$URL/rest/v1/")
          echo "Supabase HTTP=$CODE"
          test "$CODE" = "200"
