name: apply_video_entries

# Промо-ролики (Пн/Ср/Пт) лежат заготовками в plans/video_entries/ и не зависят от того,
# кто и как создал план месяца (генератор, ручной план, перегенерация). Этот воркфлоу
# дописывает недостающие записи в существующие планы месяцев (идемпотентно, по slug).
# Запуск: пуш в main, затрагивающий планы или заготовки; вручную; плюс страховка по cron.
on:
  push:
    branches: [main]
    paths:
      - "plans/monthly_plan_*.md"
      - "plans/video_entries/**"
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: apply-video-entries
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install python-frontmatter==1.1.0 PyYAML==6.0.3

      - name: Apply video entries to existing monthly plans
        run: |
          for month in $(ls plans/video_entries | cut -c1-7 | sort -u); do
            if [ -f "plans/monthly_plan_${month}.md" ]; then
              PYTHONPATH=. python -m src.apply_video_entries --month "$month"
            else
              echo "plan ${month} does not exist yet — skip"
            fi
          done

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain plans/)" ]; then
            echo "Nothing to apply."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plans/
          git commit -m "chore(plan): video entries applied to monthly plans [skip ci]"
          git pull --rebase
          git push
