name: centry_funnel

# TG-доставка ОТКЛЮЧЕНА (quick 260530-x7x, 2026-05-31): гибридный отчёт
# (src/hybrid_report, store_metrics.yml, Пн) шлёт per-app сообщение в канал
# «Планировщик» и покрывает воронку Centry. Этот workflow оставлен ЖИВЫМ ради
# накопления собственного снапшота centry_funnel_snapshots.json (изоляция, без
# правок кода centry_funnel), но БЕЗ дублирующего сообщения в канал: TG-creds в
# шаге обнулены → send_to_planner вернёт False (WARN); шаг continue-on-error.
#
# Еженедельный отчёт-воронка Centry (install → профиль → регистрация → активация).
# Cron Вт 12:12 UTC = 15:12 МСК (через 5 мин после Diktum-воронки, +12 offset
# против GH-cron-drift). Период отчёта = прошлая неделя Пн–Вс.
# ВНИМАНИЕ: schedule срабатывает только на default-ветке (main) — активируется
# после мержа feat/centry-funnel в main. workflow_dispatch работает на любой ветке.
#
# Primary trigger: Cloudflare Worker `forton-cron-trigger` (Вт 12:12 UTC
# POST'ит на /actions/workflows/centry_funnel.yml/dispatches). CF cron
# секундной точности, не throttles. GH schedule оставлен как backup.
# Incident 2026-05-26: оба funnel-workflow дропнулись на первом плановом
# вторнике после деплоя — добавлен CF Worker как primary.
# CF Worker source: marketing-v3/cf-worker/forton-cron-trigger/
on:
  schedule:
    - cron: "12 12 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write   # commit snapshot JSON

concurrency:
  group: centry-funnel
  cancel-in-progress: false

jobs:
  collect-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.BOT_DISPATCH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect funnel snapshot (TG-send disabled — см. шапку)
        # TG-доставка отключена: гибридный отчёт (hybrid_report) шлёт per-app в
        # понедельник. Пустые TG-creds → send_to_planner вернёт False (WARN), но
        # снапшот/лог отрабатывают. continue-on-error: rc=1 не валит job.
        continue-on-error: true
        env:
          TG_PLANNER_BOT_TOKEN: ""
          TG_OWNER_CHAT_ID: ""
          APPMETRICA_OAUTH_TOKEN: ${{ secrets.APPMETRICA_OAUTH_TOKEN }}
          SUPABASE_URL_CENTRY: ${{ secrets.SUPABASE_URL_CENTRY }}
          SUPABASE_SERVICE_ROLE_KEY_CENTRY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_CENTRY }}
        run: PYTHONPATH=. python -m src.centry_funnel.cli

      - name: Commit updated snapshot
        env:
          GIT_AUTHOR_NAME: forton-metrics-bot
          GIT_AUTHOR_EMAIL: forton-metrics-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: forton-metrics-bot
          GIT_COMMITTER_EMAIL: forton-metrics-bot@users.noreply.github.com
        run: |
          # git add сначала: на первом запуске файл untracked, и `git diff
          # --quiet` его НЕ видит (вернул бы 0 → коммит пропускался). Стейджим,
          # затем проверяем staged-дифф — работает для нового/изменённого/равного.
          git add .metrics/centry_funnel_snapshots.json
          if git diff --cached --quiet -- .metrics/centry_funnel_snapshots.json; then
            echo "snapshot unchanged — no commit"
            exit 0
          fi
          git commit -m "auto: weekly centry funnel snapshot [skip ci]"
          git pull --rebase
          git push
